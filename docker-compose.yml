services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: formflow_owner
      POSTGRES_PASSWORD: formflow_dev
      POSTGRES_DB: formflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U formflow_owner -d formflow"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - formflow-network

  formflow-web:
    build:
      context: .
      dockerfile: Dockerfile
    image: formflow-web:local
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - DATABASE_URL=postgresql://formflow_owner:formflow_dev@postgres:5432/formflow
      - APP_DATABASE_URL=postgresql://formflow_app:formflow_app_dev@postgres:5432/formflow
      - SERVICE_DATABASE_URL=postgresql://formflow_service:formflow_service_dev@postgres:5432/formflow
      - STORAGE_DRIVER=local
      - NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
      - CLERK_SECRET_KEY=${CLERK_SECRET_KEY}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health/live | grep -q '\"status\":\"ok\"' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - formflow-network

  formflow-worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    image: formflow-worker:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      - NODE_ENV=production
      - WORKER_HEALTH_PORT=8081
      - DATABASE_URL=postgresql://formflow_owner:formflow_dev@postgres:5432/formflow
      - APP_DATABASE_URL=postgresql://formflow_app:formflow_app_dev@postgres:5432/formflow
      - SERVICE_DATABASE_URL=postgresql://formflow_service:formflow_service_dev@postgres:5432/formflow
      - STORAGE_DRIVER=local
      - AWS_REGION=ap-south-1
      - SUBMISSIONS_QUEUE_URL=
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8081/health/live | grep -q '\"status\":\"ok\"' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - formflow-network

  formflow-migrate:
    build:
      context: .
      dockerfile: Dockerfile.migrate
    image: formflow-migrate:local
    restart: "no"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://formflow_owner:formflow_dev@postgres:5432/formflow
      - APP_DATABASE_URL=postgresql://formflow_app:formflow_app_dev@postgres:5432/formflow
      - SERVICE_DATABASE_URL=postgresql://formflow_service:formflow_service_dev@postgres:5432/formflow
      - APP_DB_PASSWORD=formflow_app_dev
      - SERVICE_DB_PASSWORD=formflow_service_dev
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - formflow-network

volumes:
  postgres_data:

networks:
  formflow-network:
    driver: bridge
